name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  gem:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gem
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.2"
          - "3.3"
          - "3.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          working-directory: gem
          bundler-cache: true

      - name: Minitest
        run: bundle exec rake test

  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gem

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          working-directory: gem
          bundler-cache: true

      - name: Lint
        run: bundle exec rake lint

  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          working-directory: demo
          bundler-cache: true

      - name: Migrate test database
        run: bin/rails db:migrate RAILS_ENV=test

      - name: Run RSpec
        run: bundle exec rspec
