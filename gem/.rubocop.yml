AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.2
  UseCache: false
  Exclude:
    - "vendor/**/*"

Layout/LineLength:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Style/WordArray:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Style/DoubleNegation:
  Enabled: false

Layout/HashAlignment:
  Enabled: false

Lint/AmbiguousBlockAssociation:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false

Gemspec/RequireMFA:
  Enabled: false

# A dial's type is anything that answers ===: a class, a range, a regexp, an
# Array of allowed values, a Literal type. The operator is the abstraction.
Style/CaseEquality:
  Enabled: false

# Dial#clear returns whether there was anything to clear. Naming it clear? would
# read as a question about state rather than the instruction it is.
Naming/PredicateMethod:
  Enabled: false

# dials.rb declares the error hierarchy before requiring the files that raise it.
Style/OneClassPerFile:
  Enabled: false
